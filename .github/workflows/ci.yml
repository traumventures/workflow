name: ci

# On demand only: gh workflow run <this file> --ref <branch>. Nothing runs by
# itself on pull requests or pushes; deploys and releases run their own checks.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    uses: traumventures/ci/.github/workflows/typescript.yml@v1
